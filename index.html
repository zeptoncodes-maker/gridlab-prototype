<!DOCTYPE html>
<html>
<head>
  <title>GridLab Prototype</title>
  <style>
    :root {
      --paper: #101216;
      --surface: #191C21;
      --stripe: #1D2127;
      --header-bg: #15171C;
      --ink: #F3F5F7;
      --ink-soft: #A7ADB6;
      --ink-faint: #676E79;
      --line: #272B32;
      --line-soft: #20242A;
      --accent: #2DD4BF;
      --accent-dark: #12A594;
      --accent-ink: #06201C;
      --accent-soft: rgba(45, 212, 191, 0.11);
      --danger: #F87171;
      --mono: 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--paper);
      background-image:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(45, 212, 191, 0.05), transparent);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      padding: 36px 44px;
    }

    .shell {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand h1 {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--ink);
    }

    .brand .dims {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.01em;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(45, 212, 191, 0.2);
      padding: 5px 11px;
      border-radius: 100px;
    }

    .brand .dims .x { color: var(--ink-faint); }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--ink-soft);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25), 0 24px 60px -20px rgba(0,0,0,0.6);
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .console {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--header-bg);
      flex-shrink: 0;
    }

    .prompt {
      font-family: var(--mono);
      font-size: 16px;
      color: var(--accent);
      font-weight: 700;
    }

    #searchInput {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--mono);
      font-size: 15px;
      color: var(--ink);
      padding: 8px 0;
    }

    #searchInput:focus { outline: none; }
    #searchInput::placeholder { color: var(--ink-faint); }

    button {
      padding: 10px 20px;
      border: 1px solid var(--accent-dark);
      background: var(--accent-dark);
      color: var(--accent-ink);
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.005em;
      cursor: pointer;
      font-family: var(--sans);
      transition: background 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    button:hover { background: var(--accent); }
    button:active { transform: scale(0.97); }

    button.ghost {
      background: transparent;
      color: var(--ink-soft);
      border-color: var(--line);
    }

    button.ghost:hover { background: var(--paper); color: var(--ink); }

    #scrollBox {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--header-bg);
      text-align: left;
      padding: 13px 24px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--ink-faint);
      border-bottom: 1px solid var(--line);
      z-index: 1;
    }

    tbody td {
      padding: 11px 24px;
      border-bottom: 1px solid var(--line-soft);
      color: var(--ink);
    }

    tbody tr:nth-child(even) td { background: var(--stripe); }

    tbody tr {
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    tbody tr:hover td { background: var(--accent-soft) !important; }
    tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

    tbody tr.hit td {
      background: var(--accent-soft);
    }

    tbody tr.hit td:first-child {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .footer {
      padding: 16px 24px 18px;
      border-top: 1px solid var(--line);
      background: var(--header-bg);
      flex-shrink: 0;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-bottom: 9px;
    }

    .footer-top strong { color: var(--accent); }

    .progress-track {
      height: 5px;
      background: var(--line);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 100px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--ink-faint);
    }

    #scrollBox::-webkit-scrollbar { width: 11px; }
    #scrollBox::-webkit-scrollbar-track { background: var(--surface); }
    #scrollBox::-webkit-scrollbar-thumb { background: var(--line); border-radius: 100px; border: 3px solid var(--surface); }
    #scrollBox::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
  </style>
</head>
<body>
  <div class="shell">

    <div class="topbar">
      <div class="brand">
        <h1>GridLab</h1>
        <span class="dims"><span id="dimRows">0</span><span class="x">×</span><span id="dimCols">0</span></span>
      </div>
      <div class="status"><span class="dot"></span> DuckDB connected · local</div>
    </div>

    <div class="card">
      <div class="console">
        <span class="prompt">›</span>
        <input type="text" id="searchInput" placeholder="department = 'Engineering'">
        <button id="searchBtn">Run</button>
        <button class="ghost" id="resetBtn">Reset</button>
      </div>

      <div id="scrollBox">
        <table>
          <thead id="gridHead"></thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="footer">
        <div class="footer-top">
          <span><strong id="loadedCount">0</strong> / 100,000 rows loaded</span>
          <span id="loadedPct">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="hint" id="hintText">Only the rows you've scrolled to are ever loaded into memory.</div>
      </div>
    </div>

  </div>

  <script>
    let offset = 0;
    const batchSize = 50;
    const totalRows = 100000;
    let loading = false;
    let loadedTotal = 0;
    let searchMode = false; // true while showing filtered search results
    let endReached = false; // true once we've scrolled past the last row

    function renderHeader(row) {
      const head = document.getElementById('gridHead');
      head.innerHTML = '';
      const tr = document.createElement('tr');
      const keys = Object.keys(row);
      keys.forEach(key => {
        const th = document.createElement('th');
        th.textContent = key;
        tr.appendChild(th);
      });
      head.appendChild(tr);
      document.getElementById('dimCols').textContent = keys.length;
    }

    function renderRows(rows, append, isHit) {
      const body = document.getElementById('gridBody');
      if (!append) body.innerHTML = '';
      rows.forEach(row => {
        const tr = document.createElement('tr');
        if (isHit) tr.classList.add('hit');
        Object.values(row).forEach(val => {
          const td = document.createElement('td');
          td.textContent = val;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    function updateCount(n, reset) {
      loadedTotal = reset ? n : loadedTotal + n;
      document.getElementById('loadedCount').textContent = loadedTotal.toLocaleString();
      const pct = Math.min(100, (loadedTotal / totalRows) * 100);
      document.getElementById('loadedPct').textContent = pct.toFixed(2) + '%';
      document.getElementById('progressFill').style.width = pct + '%';
      // The dims badge always reflects the full sheet, not the current
      // search result count, so it stays a stable "this is the sheet's
      // shape" readout even while filtering.
      if (!searchMode) {
        document.getElementById('dimRows').textContent = totalRows.toLocaleString();
      }
    }

    function showError(message) {
      const body = document.getElementById('gridBody');
      body.innerHTML = '';
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 20;
      td.textContent = 'Query error: ' + message;
      td.style.color = '#F87171';
      td.style.padding = '16px 18px';
      tr.appendChild(td);
      body.appendChild(tr);
    }

    async function loadMore() {
      if (loading || endReached) return;
      loading = true;
      const result = await window.gridlabAPI.getRows(offset, batchSize);
      if (result.error) {
        showError(result.error);
        loading = false;
        return;
      }
      const rows = result.rows;
      const startingFresh = offset === 0;
      if (startingFresh && rows[0]) renderHeader(rows[0]);
      renderRows(rows, !startingFresh, false); // clear the grid when starting from offset 0
      updateCount(rows.length, startingFresh);
      offset += batchSize;
      if (rows.length < batchSize) {
        endReached = true; // fewer rows than requested means we hit the end
        document.getElementById('hintText').textContent =
          "You've reached the end of the dataset — all 100,000 rows loaded.";
      }
      loading = false;
    }

    document.getElementById('scrollBox').addEventListener('scroll', (e) => {
      if (searchMode) return; // don't auto-load unfiltered data while viewing search results
      const box = e.target;
      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 50) {
        loadMore();
      }
    });

    document.getElementById('searchBtn').addEventListener('click', async () => {
      const where = document.getElementById('searchInput').value;
      const result = await window.gridlabAPI.runQuery(where);
      if (result.error) {
        showError(result.error);
        return;
      }
      const rows = result.rows;
      searchMode = true;
      if (rows[0]) renderHeader(rows[0]);
      renderRows(rows, false, true);
      updateCount(rows.length, true);
      document.getElementById('hintText').textContent =
        `Showing ${rows.length} search result(s). Click Reset to browse the full dataset again.`;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('hintText').textContent =
        "Only the rows you've scrolled to are ever loaded into memory.";
      searchMode = false;
      endReached = false;
      offset = 0;
      document.getElementById('scrollBox').scrollTop = 0; // fix: return scroll position to the top
      loadMore();
    });

    loadMore();
  </script>
</body>
</html>
